[package]
name = "axum-sentinel-monitor"
version = "0.1.4"
edition = "2024"
rust-version = "1.98.1"
description = "A Fiber Monitor-style runtime dashboard for Axum"
license = "MIT"
repository = "https://github.com/romalin99/axum-sentinel-monitor"
keywords = ["axum", "monitoring", "dashboard", "metrics"]
categories = ["web-programming", "development-tools::profiling"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
num_threads = "0.1"
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
sysinfo = "0.39"
tokio = { version = "1", default-features = false, features = ["rt"] }
tower = "0.5"
tikv-jemalloc-ctl = { version = "0.7", optional = true, features = ["use_std", "stats"] }

[features]
default = []
# Read the heap figures from jemalloc (`stats.*` via tikv-jemalloc-ctl) instead of glibc's
# `mallinfo2`. Enable when the host binary uses `tikv-jemallocator` as its global allocator;
# the C-side glibc heap (native libraries) is then no longer reflected in heap_*.
jemalloc = ["dep:tikv-jemalloc-ctl"]

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
