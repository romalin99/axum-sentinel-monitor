[package]
name = "axum-sentinel-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An embeddable real-time system monitor for Axum"
license = "MIT"
repository = "https://github.com/romalin99/axum-sentinel-monitor"
keywords = ["axum", "monitoring", "dashboard", "metrics"]
categories = ["web-programming", "development-tools::profiling"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
netstat2 = "0.11"
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
sysinfo = "0.37"
tower = "0.5"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
