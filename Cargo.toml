[package]
name = "axum-sentinel-monitor"
version = "0.1.9"
edition = "2024"
rust-version = "1.99.0"
description = "A Fiber Monitor-style runtime dashboard for Axum"
license = "MIT"
repository = "https://github.com/romalin99/axum-sentinel-monitor"
homepage = "https://github.com/romalin99/axum-sentinel-monitor"
documentation = "https://docs.rs/axum-sentinel-monitor"
readme = "README.md"
keywords = ["axum", "monitoring", "middleware", "metrics", "sentinel"]
categories = ["web-programming", "development-tools::profiling"]
exclude = ["/.github", "/benches", "/examples/data", "/tcg-uss-se-dev.*", "/constitution.md"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
num_threads = "0.1"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
sysinfo = "0.39"
tokio = { version = "1", default-features = false, features = ["rt"] }
tower = "0.5"
tikv-jemalloc-ctl = { version = "0.7", optional = true, features = ["use_std", "stats"] }

[features]
default = []
# Read the heap figures from jemalloc (`stats.*` via tikv-jemalloc-ctl) instead of glibc's
# `mallinfo2`. Enable when the host binary uses `tikv-jemallocator` as its global allocator;
# the C-side glibc heap (native libraries) is then no longer reflected in heap_*.
jemalloc = ["dep:tikv-jemalloc-ctl"]

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }

# Comment rules from constitution.md (I. 注释规范); CI runs clippy with `-D warnings`.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
